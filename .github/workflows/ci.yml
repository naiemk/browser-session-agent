name: CI

# Everything here is token-free. No provider key is available to this workflow, and the
# agent is exercised through a mock model that speaks the same stream protocol a real one
# does, so the tool loop, verification, commit gate, and criteria are all covered for
# nothing. Live model runs live in baseline.yml and are triggered by hand.
on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Scoped to the new core, runtime, suite, and CLI. The legacy hosted product has
      # pre-existing type errors and is not in scope for this gate.
      - name: Typecheck
        run: npm run typecheck

      - name: Unit, integration, and end-to-end tests
        run: npm test

      - name: Task suite — reference target (validates the tasks themselves)
        run: npm run suite:reference

      - name: Task suite — mock target (real loop, no tokens)
        run: npm run suite -- --all --optimize-out /tmp/optimize-current.json

      # Reports what moved and why, and never fails. A build that breaks on cost teaches
      # people to raise the budget; a rise with a named cause is a decision instead.
      - name: Cost report against the committed baseline
        if: always()
        continue-on-error: true
        run: |
          {
            echo '## Cost against baseline'
            echo ''
            echo '```'
            npx tsx src/cli/run.ts compare optimize/baseline.json /tmp/optimize-current.json 2>&1 || true
            echo '```'
            echo ''
            echo 'Token and cache numbers need a paid run: trigger the Live baseline workflow.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Assert no provider key leaked into CI
        # A green CI must never depend on a paid call. If a key is present here, the
        # token-free guarantee is not actually being tested.
        run: |
          for name in OPENROUTER_API_KEY ANTHROPIC_API_KEY OPENAI_API_KEY open_router_api_key; do
            if [ -n "${!name:-}" ]; then
              echo "::error::$name is set in CI; the default workflow must stay token-free"
              exit 1
            fi
          done
