<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Search</title>
  </head>
  <body>
    <nav>
      <a href="/roster">Roster</a>
      <a href="/guests">Guests</a>
    </nav>
    <main>
      <h1>Search</h1>
      <form role="search" action="/find" method="get">
        <input type="search" name="q" value="{{q}}" placeholder="Search people" />
        <button type="submit">Search</button>
      </form>
      <!-- The route out when a list row gives you a name and nothing to click. -->
      <ul>
        {{results}}
      </ul>
    </main>
  </body>
</html>
