<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Northwind Careers — Apply</title>
  </head>
  <body class="ats-template">
    <header><h1>Northwind Traders</h1></header>
    <h2>Apply for Staff Engineer</h2>
    <form method="post" action="/tmpl-a">
      <label>First name <input name="firstName" /></label>
      <label>Last name <input name="lastName" /></label>
      <label>Email <input name="email" type="email" /></label>
      <label>Work authorization
        <select name="auth">
          <option value="">Select…</option>
          <option value="yes">Authorized</option>
          <option value="no">Not authorized</option>
        </select>
      </label>
      <button type="submit">Submit application</button>
    </form>
    <p role="alert">{{error}}</p>
  </body>
</html>
