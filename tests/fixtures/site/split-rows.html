<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Members</title>
  </head>
  <body>
    <main>
      <h1>Members</h1>
      <!--
        The shape that defeated the agent on a real site: each row's identity is split
        across siblings. The anchor carries the handle, a sibling carries the display
        name, and nothing contains both. Asked to find "Varya", the agent could not match
        her against a row whose only readable text was "v_varvar".
      -->
      <ul>
        <li>
          <a href="/p/v_varvar">v_varvar</a>
          <span class="display">Varya Kuznetsova</span>
        </li>
        <li>
          <a href="/p/dana">dana</a>
          <span class="display">Dana Ivanova</span>
        </li>
        <li>
          <a href="/p/ada">ada</a>
          <span class="display">Ada Lovelace</span>
        </li>
      </ul>
    </main>
  </body>
</html>
