# One-machine trial: API + UI + desktop node in Docker. No VPS required.
#   cp .env.example .env
#   docker compose -f deploy/docker/compose.local.yml up --build
#   open http://127.0.0.1:8080/?token=$BSA_TOKEN
name: bsa-local
services:
  api:
    image: ${BSA_API_IMAGE:-ghcr.io/naiemk/browser-session-api:latest}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.api
    environment:
      BSA_TOKEN: ${BSA_TOKEN:-dev}
      PORT: "8787"
      BSA_NO_PI: ${BSA_NO_PI:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:-}
    volumes:
      - api-data:/data
    ports:
      - "8787:8787"
    restart: unless-stopped
  ui:
    image: ${BSA_UI_IMAGE:-ghcr.io/naiemk/browser-session-ui:latest}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.ui
    expose:
      - "80"
    restart: unless-stopped
  gateway:
    image: nginx:1.27-alpine
    volumes:
      - ../vibed/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${BSA_HTTP_PORT:-8080}:80"
    depends_on:
      - api
      - ui
    restart: unless-stopped
  node:
    image: ${BSA_NODE_IMAGE:-ghcr.io/naiemk/browser-session-node:latest}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.node
    environment:
      BSA_API_URL: ws://api:8787/node
      BSA_TOKEN: ${BSA_TOKEN:-dev}
      BSA_HOME: /data
      BSA_HEADLESS: "1"
    volumes:
      - ${BSA_DATA:-node-data}:/data
    ipc: host
    shm_size: "1gb"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  api-data:
  node-data:
