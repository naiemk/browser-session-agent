# API site on the VPS. LLM HTTP only — no Playwright, no Chromium image.
# Canonical image: deploy/docker/Dockerfile.api (BSA_HOME=/data).
name: browser-session-api
runtime: node22
image: ghcr.io/naiemk/browser-session-api:latest
command: ["node", "--import", "tsx", "src/hosts/web/cli.ts"]
port: 8787
health: /healthz
env:
  - BSA_TOKEN
  - BSA_HOME
  - BSA_AGENT_DIR
  - BSA_SESSION_DIR
  - BSA_COOKIE_SECURE
  - BSA_REGISTER_OPEN
  - ANTHROPIC_API_KEY
  - OPENAI_API_KEY
  - OPENROUTER_API_KEY
  - AI_GATEWAY_API_KEY
  - PI_OFFLINE
volumes:
  - /var/lib/browser-session:/data
playwright: false
chromium: false
